# Development database only
# Usage: docker compose -f docker-compose.dev.yml up -d
# Connect from IDE/local app with: jdbc:postgresql://localhost:5432/springjwt
services:
  db:
    image: postgres:16-alpine
    container_name: springjwt-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: springjwt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d springjwt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata-dev:
    driver: local
