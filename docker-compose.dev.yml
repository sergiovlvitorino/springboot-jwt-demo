# Development database only
# Usage:
#   1. cp .env.example .env   (one-time)
#   2. docker compose -f docker-compose.dev.yml up -d
# Connect from IDE/local app with: jdbc:postgresql://localhost:5432/springjwt
services:
  db:
    image: postgres:16-alpine
    container_name: springjwt-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: springjwt
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d springjwt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata-dev:
    driver: local
