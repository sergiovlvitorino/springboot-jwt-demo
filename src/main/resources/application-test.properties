# Test Profile Configuration

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2

# JWT Configuration
jwt.secret=test-only-secret-not-for-production-minimum-32chars!!
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Rate limit — higher threshold for test suite (many logins from same IP)
login.rate-limit.max-attempts=100

# Security Hardening — relaxed thresholds for tests
security.account-lockout.max-attempts=100

# Disable Actuator during tests
management.endpoints.web.exposure.include=health

# Logging Configuration (minimal logging during tests)
logging.level.com.sergiovitorino.springbootjwt=WARN
logging.level.org.springframework=WARN
